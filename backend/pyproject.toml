[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epl-dashboard"
version = "0.1.0"
description = "Local EPL dashboard backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "httpx2>=2,<3",
    "pyright>=1.1.400,<2",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["api", "config", "main", "models", "providers", "refresh", "service", "storage"]
